name: ToMoon Auto Build

# Builds the plugin on top of the upstream v0.2.8 release package: the bundled
# mihomo core, subconverter, dashboards, rules and external web page are taken
# from that package (several of their original download sources are gone), and
# only the parts built from this repository are replaced: the Rust backend,
# the Decky frontend and the Python modules.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_REPO: YukiCoco/ToMoon
  BASE_TAG: v0.2.8

jobs:
  build_plugin:
    name: Build Plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip upx

      - name: Download base package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$BASE_TAG" -R "$BASE_REPO" -p '*.zip' -O base.zip
          mkdir -p release
          unzip -q base.zip -d release
          test -x release/tomoon/bin/tomoon

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build frontend
        run: |
          cp -r usdpl src/
          npm i --legacy-peer-deps --no-audit --no-fund
          npm run build

      - uses: dtolnay/rust-toolchain@stable
      - name: Build backend
        working-directory: backend
        run: |
          cargo test --release --target x86_64-unknown-linux-gnu url_credentials
          cargo build --release --target x86_64-unknown-linux-gnu
          upx target/x86_64-unknown-linux-gnu/release/tomoon

      - name: Assemble package
        run: |
          cp backend/target/x86_64-unknown-linux-gnu/release/tomoon release/tomoon/bin/tomoon
          cp dist/index.js release/tomoon/dist/index.js
          cp main.py plugin.json package.json release/tomoon/
          rm -rf release/tomoon/py_modules
          cp -r py_modules release/tomoon/py_modules
          cd release
          zip -qr tomoon.zip tomoon
          unzip -l tomoon.zip | tail -1

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: tomoon-artifacts
          path: ./release/tomoon.zip
          if-no-files-found: error

  publish:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build_plugin
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tomoon-artifacts
          path: /tmp/artifacts
      - run: mv /tmp/artifacts/tomoon.zip "/tmp/artifacts/tomoon-${GITHUB_REF_NAME}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: /tmp/artifacts/tomoon-*.zip
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          # v1.2.3 is a release; v1.2.3-rc.1 / -alpha.1 / -beta.1 are pre-releases
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
